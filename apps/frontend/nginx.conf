server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://basemaps.cartocdn.com data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:8000 https://basemaps.cartocdn.com; worker-src blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /data/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    location /health {
        return 200 '{"status":"ok","service":"sos-pereira-frontend"}';
        add_header Content-Type application/json;
    }
}

